name: Cleanup Old Workflow Runs

on:
  workflow_dispatch: # This allows you to trigger it manually from the Actions tab
    inputs:
      workflow_id:
        description: 'The filename of the workflow to clean up (e.g., wormy.yaml:83814171, waka-readme.yml:191057752, cleanup-runs.yaml:237145155)'
        required: true
        type: string

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./scripts/delete_runs.sh

      - name: Run deletion script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # Reusing the token you created earlier!
          OWNER: ${{ github.repository_owner }} # Automatically gets your username
          REPO: ${{ github.event.repository.name }} # Automatically gets the repo name
          WORKFLOW_ID: ${{ inputs.workflow_id }} # Passed in when you click run
        run: ./scripts/delete_runs.sh